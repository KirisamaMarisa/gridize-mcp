# Releases the version in package.json: npm (trusted publishing over GitHub
# OIDC, no token) and then the official MCP Registry. Run it by hand after
# bumping "version" in package.json and both versions in server.json.
# Safe to re-run: a version already on npm or in the registry is skipped.
name: Release

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUBLISHER_VERSION: v1.8.16
      PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
      SERVER_NAME: io.github.KirisamaMarisa/gridize-mcp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check versions match
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e "
            const s = require('./server.json');
            const v = process.argv[1];
            if (s.version !== v || s.packages[0].version !== v) {
              console.error('server.json versions must equal package.json ' + v);
              process.exit(1);
            }" "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: |
          if npm view "gridize-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "gridize-mcp@${VERSION} is already on npm; skipping."
          else
            npm ci
            npm publish --access public
          fi

      # A new npm version can take a few minutes to become visible, and the
      # registry rejects a package version it cannot find yet.
      - name: Wait for the version on npm
        run: |
          for i in $(seq 1 40); do
            if npm view "gridize-mcp@${VERSION}" version >/dev/null 2>&1; then
              echo "gridize-mcp@${VERSION} is visible on npm."
              exit 0
            fi
            sleep 15
          done
          echo "gridize-mcp@${VERSION} is still not visible on npm after 10 minutes."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=${SERVER_NAME}" \
              | grep -q "\"version\":\"${VERSION}\""; then
            echo "${SERVER_NAME} ${VERSION} is already in the registry; skipping."
          else
            ./mcp-publisher validate
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish
          fi
